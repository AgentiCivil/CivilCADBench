User nobody
Group nogroup
Port 8888
Listen 127.0.0.1
Timeout 900
LogLevel Info
MaxClients 50
# loopback only; the agent container comes in through the Unix socket
Allow 127.0.0.1
# host allowlist
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"
ConnectPort 443
DisableViaHeader Yes
