[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civilcadbench"
version = "0.1.0"
description = "CivilCADBench: deterministic scorers and the ccb command line"
readme = "README.md"
license = "MIT"                 # the code; the data under data/ is CC BY-NC 4.0, see data/LICENSE
license-files = ["LICENSE"]
requires-python = ">=3.12"
# the versions of code/requirements.txt, with which the scorers were tested
dependencies = [
    "ezdxf==1.4.5",
    "pymupdf",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
    "huggingface_hub",      # ccb download
]

[project.scripts]
ccb = "civilcadbench.cli:main"

[tool.setuptools]
packages = ["civilcadbench"]

[tool.setuptools.package-data]
civilcadbench = ["prompts.json"]
